name: Integration

# THE single owner of CHR integration-test execution (issue #29). Every workflow
# that needs "boot real CHRs and run test/integration/" goes through this file —
# there are no parallel copies of the runner logic anywhere else.
#
# Two faces:
#   workflow_call     — wrappers (main.yml push, sweep.yml, release checks) reuse it.
#   workflow_dispatch — the manual/lab face. Agents: this is how you ground a
#                       hypothesis on a platform you don't have locally, e.g.
#
#     gh workflow run integration.yml --ref <branch> \
#       -f platforms=macos-arm64 -f test-filter=exec.test.ts \
#       -f routeros-targets=7.24beta2 -f run-examples=false
#
# The run is a full PLATFORMS × TARGETS matrix: one dispatch can cover, say,
# gating platforms × "stable,long-term,7.24rc1" — no wrapper jobs or repeat
# dispatches needed. The default run includes the examples smoke harness and
# PowerShell lint (run-examples defaults ON — examples are part of the flow,
# not an optional extra); narrow/lab dispatches turn it off explicitly.
#
# Platform ids (comma-separate to combine, or use a group alias):
#   linux-x86    ubuntu-latest      x86 CHR    KVM   standard budget
#   linux-arm64  ubuntu-24.04-arm   arm64 CHR  KVM   standard budget (may fall back to TCG)
#   macos-arm64  macos-15           arm64 CHR  TCG   standard budget (see note below)
#   macos-x86    macos-15-intel     x86 CHR    HVF   extended budget
#   windows-x86  windows-latest     x86 CHR    TCG   extended budget (no hw accel — slow)
#   gating  = linux-x86,linux-arm64,macos-arm64      all = every platform
#
# The accelerator column and the budget column are deliberately independent —
# see the platform table in the plan job for the grounding behind each value.
# macos-x86 read "TCG" here until #76; it is a bare-metal Intel runner and
# detectAccel() returns hvf on it. It keeps the extended budget anyway, because
# its full suite has never yet finished inside 60 min — an open question (#76),
# not a property of its accelerator.
#
# NOTE (quickchr#97): the macos-arm64 leg does NOT exercise HVF. Hosted macos-15
# runners are themselves VMs ("Apple M1 (Virtual)") and report kern.hv_support=0,
# so detectAccel() returns tcg there — verified in run 29669706663's platform log.
# Separately, quickchr now auto-selects TCG for BOTH guest arches on Apple Silicon
# by policy. So a green macos-arm64 leg is NOT evidence about the HVF path; that
# still needs a physical Apple Silicon Mac with --accel hvf.
#
# Every platform runs the FULL suite by default — including the slow ones, which
# is the honest "find out where windows/mac break" path (they just get a much
# larger timeout). Pass tcg-smoke=true to bound the extended-budget legs to the
# curated anchor.test.ts subset instead (the weekly sweep does, to cap its cost).
# There is NO continue-on-error anywhere in this file: green means the selected
# tests passed, red means they didn't (see ci.instructions.md "green should be
# green").
#
# Timeouts are two-tier on purpose (#76). The job budget (matrix.timeout) is the
# outer bound; the test step carries its own cap 10 min under it. A job timeout
# tears the runner down and `if: always()` never fires, so the artifact upload
# is skipped and the leg produces no evidence at all — the exact reason macos-x86
# resisted diagnosis for weeks. A step timeout leaves the job alive to report.
#
# Per-file timing is always captured (integration-timing.txt in the artifact) —
# boot/test duration by platform × accel × RouterOS version is the raw feed for
# the ci-data metrics scheme (#30).
#
# IMPORTANT: every step that pipes `bun test … | tee` MUST run under
# `set -eo pipefail` — without it tee's exit code masks bun's failure and the
# step reports green (this bit us: arm64 run green with every test failing).
#
# ── EXPERIMENT LEVERS: qemu-version and accel ─────────────────────────────────
# Two inputs exist so a controlled contrast can vary ONE factor and hold the
# rest — the whole test/forensics/artifact path stays identical, which is what
# makes two dispatches comparable at all. Both are inert when empty, which is
# every normal run; nothing in main.yml, sweep.yml or release.yml sets them.
#
#   qemu-version   Linux only. Builds that exact upstream QEMU from source
#                  (download.qemu.org) and puts it first on PATH, replacing the
#                  distro package as the *system emulator only*. qemu-img, the
#                  UEFI firmware and everything else stay on the distro build on
#                  purpose: if the contrast flips, the emulator is the only thing
#                  that changed. Costs ~10-15 min of build time per leg.
#   accel          Pins QUICKCHR_ACCEL rather than letting detectAccel pick. The
#                  linux legs "may fall back to TCG" depending on whether the
#                  runner ships a writable /dev/kvm — fine normally, fatal for a
#                  contrast, because the two arms could silently differ in the
#                  variable you were trying to hold.
#
# Introduced for B9 of #110 (#79): `linux-arm64 · long-term · start-stop.test.ts`
# has only ever failed under QEMU 8.2.2, while the arm64+TCG leg on QEMU 11.0.2
# is green — a hypothesis the matrix could not test, because host OS changed with
# it. Keep them general; they are not #79-specific.

on:
  workflow_dispatch:
    inputs:
      platforms:
        type: string
        description: "Comma-separated platform ids (linux-x86, linux-arm64, macos-arm64, macos-x86, windows-x86) or an alias: 'gating' (linux-x86,linux-arm64,macos-arm64) / 'all'"
        default: "linux-x86"
      run-integration:
        type: boolean
        description: "Run the integration test suite on the selected platforms"
        default: true
      run-examples:
        type: boolean
        description: "Run the examples smoke harness (+ PowerShell lint) on each matrix leg. Default ON — turn off for narrow/lab dispatches."
        default: true
      test-filter:
        type: string
        description: "Integration: comma-separated test file names (e.g. 'exec.test.ts,anchor.test.ts'). Empty = all files."
        default: ""
      tcg-smoke:
        type: boolean
        description: "Bound the extended-budget platforms (macos-x86, windows-x86) to the anchor smoke subset when test-filter is empty. Off = full suite everywhere (those legs are slow — extended timeout)."
        default: false
      example-filter:
        type: string
        description: "Examples: comma-separated example names for the smoke harness (e.g. 'quickstart,rollback'). Empty = the curated subset."
        default: ""
      routeros-targets:
        type: string
        description: "Comma-separated RouterOS targets — channels (stable/long-term/testing/development) and/or pinned versions (7.22.1, 7.24beta2). Each combines with each platform. Empty = stable."
        default: ""
      collect-metrics:
        type: boolean
        description: "Append this run's boot/test timing to the ci-data branch (runs/*.ndjson + tested-versions.json). Default ON — a run without recorded results is a wasted run."
        default: true
      qemu-version:
        type: string
        description: "EXPERIMENT LEVER (Linux only). Build this exact upstream QEMU from source and put it first on PATH instead of the distro package, e.g. '11.0.2'. Empty = distro QEMU (normal runs). Adds ~10-15 min to the leg."
        default: ""
      accel:
        type: string
        description: "EXPERIMENT LEVER. Pin QUICKCHR_ACCEL (tcg/kvm/hvf/auto) instead of letting detectAccel choose. Empty = auto-detect (normal runs). Use to hold the accelerator constant across a contrast whose legs might otherwise differ."
        default: ""
      watchdog-cap:
        type: string
        description: "EXPERIMENT LEVER. Force the per-file watchdog cap to this many seconds. It can only SHORTEN a cap, never lengthen one. Empty = the checked-in table (normal runs). Use to exercise the timeout path itself on a real runner without committing a test that hangs on purpose (#77)."
        default: ""
  workflow_call:
    inputs:
      platforms:
        type: string
        default: "linux-x86"
      run-integration:
        type: boolean
        default: true
      run-examples:
        type: boolean
        default: true
      test-filter:
        type: string
        default: ""
      tcg-smoke:
        type: boolean
        default: false
      example-filter:
        type: string
        default: ""
      routeros-targets:
        type: string
        default: ""
      collect-metrics:
        type: boolean
        description: "Append boot/test timing to the ci-data branch (caller must grant contents: write)"
        default: false
      artifact-prefix:
        type: string
        description: "Prefix for uploaded artifact names so parallel callers don't collide"
        default: "integration"
      qemu-version:
        type: string
        description: "Experiment lever (Linux only) — build this upstream QEMU from source instead of the distro package. Empty = distro."
        default: ""
      accel:
        type: string
        description: "Experiment lever — pin QUICKCHR_ACCEL instead of auto-detecting. Empty = auto."
        default: ""
      watchdog-cap:
        type: string
        description: "Experiment lever — force the per-file watchdog cap (seconds). Shortens only. Empty = the checked-in table."
        default: ""

# Least-privilege: this workflow only runs tests and uploads artifacts.
permissions:
  contents: read

jobs:
  # ── plan: resolve platforms × targets into one job matrix ────────────────────
  # One place defines the platform table (runner, CHR arch, accel, smoke default)
  # and crosses it with the RouterOS targets list. Unknown platform ids or
  # malformed targets FAIL the plan — a typo must never produce a silently empty
  # (falsely green) run.
  plan:
    name: Plan matrix (platforms × targets)
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # setup-bun action v2.2.0

      # Resolve every channel target to a CONCRETE version, ONCE per dispatch,
      # before any cache key is chosen (#104). Two reasons it happens here and
      # not per leg:
      #
      #   1. The cache key names the version an entry holds, so it has to be
      #      known before actions/cache runs — see scripts/ci-cache-key.ts for
      #      why a version-keyed entry may safely skip its save and a rotating
      #      one may not.
      #   2. Resolving once means every leg of one dispatch agrees on what
      #      "stable" meant, instead of each leg asking the upgrade server
      #      minutes apart and a release landing mid-matrix splitting the run.
      #
      # A resolution failure fails the plan, deliberately: it costs one 20 s job
      # instead of 15 legs that would each fail downloading from the same host.
      # The leg still boots the TARGET (channel or pin) — QUICKCHR_TEST_TARGET is
      # unchanged, so the channel-resolution path stays exercised in CI. The
      # resolved value is used for the cache key and for reporting only.
      - id: resolve
        env:
          TARGETS: ${{ inputs.routeros-targets }}
        run: |
          set -eo pipefail
          LIST="${TARGETS// /}"
          [ -z "$LIST" ] && LIST="stable"
          MAP=$(bun scripts/ci-cache-key.ts resolve "$LIST")
          echo "map=$MAP" >> "$GITHUB_OUTPUT"
          echo "Resolved RouterOS targets: $MAP"

      - id: gen
        env:
          PLATFORMS: ${{ inputs.platforms }}
          TARGETS: ${{ inputs.routeros-targets }}
          RESOLVED_MAP: ${{ steps.resolve.outputs.map }}
          TEST_FILTER: ${{ inputs.test-filter }}
          TCG_SMOKE: ${{ inputs.tcg-smoke }}
          QEMU_VERSION: ${{ inputs.qemu-version }}
          ACCEL_INPUT: ${{ inputs.accel }}
          WATCHDOG_CAP_INPUT: ${{ inputs.watchdog-cap }}
        run: |
          set -eo pipefail
          # id → label | runner | accel | budget
          #
          # `accel` is the accelerator this hosted runner is EXPECTED to give
          # detectAccel(). It is a claim about the runner, checked at runtime:
          # the Log platform step compares it against the detected value and
          # emits a ::warning:: on drift. It is reporting only — it never
          # changes what the tests do.
          #
          # `budget` is the empirical run-time class, kept separate on purpose:
          # "slow leg" is measured, not derived from the accelerator. It drives
          # the job/step timeouts and tcg-smoke eligibility.
          #
          # accel grounding:
          #   linux-x86/linux-arm64  kvm  — /dev/kvm on hosted runners; either
          #                                 may fall back to tcg when the runner
          #                                 ships without a writable /dev/kvm.
          #                                 That fallback is reported as a
          #                                 ::notice::, not drift — it is a
          #                                 runner condition, not a stale table.
          #   macos-arm64            tcg  — hosted macos-15 is itself a VM
          #                                 ("Apple M1 (Virtual)"), kern.hv_support=0
          #                                 (run 29669706663), and quickchr forces
          #                                 TCG on Apple Silicon anyway (#97).
          #   macos-x86              hvf  — macos-15-intel is bare metal: detectAccel
          #                                 returns hvf (timeoutFactor 1.5), boots
          #                                 take 30–46 s at cpu-load 0–1 %. This row
          #                                 read `tcg` until #76; the summary line
          #                                 printed that hardcoded claim directly
          #                                 under the detectAccel line contradicting
          #                                 it. Its budget stays `extended` because
          #                                 the full suite has never yet finished
          #                                 inside 60 min there — an open question
          #                                 (#76), not an accel fact.
          #   windows-x86            tcg  — no hardware acceleration available.
          table() {
            case "$1" in
              linux-x86)   echo 'linux/x86_64|ubuntu-latest|kvm|standard' ;;
              linux-arm64) echo 'linux/aarch64|ubuntu-24.04-arm|kvm|standard' ;;
              macos-arm64) echo 'macos/arm64|macos-15|tcg|standard' ;;
              macos-x86)   echo 'macos/x86_64|macos-15-intel|hvf|extended' ;;
              windows-x86) echo 'windows/x86_64|windows-latest|tcg|extended' ;;
              *) return 1 ;;
            esac
          }
          LIST="${PLATFORMS// /}"
          case "$LIST" in
            gating) LIST="linux-x86,linux-arm64,macos-arm64" ;;
            all)    LIST="linux-x86,linux-arm64,macos-arm64,macos-x86,windows-x86" ;;
          esac
          TARGET_LIST="${TARGETS// /}"
          [ -z "$TARGET_LIST" ] && TARGET_LIST="stable"
          # Validate each target: a channel name or a RouterOS version string.
          IFS=',' read -ra TARGET_ARR <<< "$TARGET_LIST"
          for t in "${TARGET_ARR[@]}"; do
            [ -z "$t" ] && continue
            if ! printf '%s' "$t" | grep -qE '^(stable|long-term|testing|development|[0-9]+\.[0-9]+(\.[0-9]+)?((beta|rc)[0-9]+)?)$'; then
              echo "::error::Invalid routeros-targets entry '$t' (channel or version like 7.22.1 / 7.24beta2)"
              exit 1
            fi
          done
          # Experiment levers, validated here so a bad one costs nothing. A lever
          # that silently does nothing is worse than a typo: the run still goes
          # green/red under a label claiming a factor was varied when it wasn't.
          QV="${QEMU_VERSION// /}"
          if [ -n "$QV" ]; then
            if ! printf '%s' "$QV" | grep -qE '^[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
              echo "::error::Invalid qemu-version '$QV' — expected an upstream release like 8.2.2 or 11.0.2 (it becomes https://download.qemu.org/qemu-<version>.tar.xz)"
              exit 1
            fi
            # Source-building QEMU is implemented for Linux only. Accepting the
            # input on a macOS/Windows leg would run the DISTRO qemu while the
            # run is labelled with a version it never used.
            case ",$LIST," in
              *,macos-arm64,*|*,macos-x86,*|*,windows-x86,*)
                echo "::error::qemu-version is Linux-only, but platforms resolved to '$LIST'. Restrict the dispatch to linux-x86 and/or linux-arm64, or drop qemu-version."
                exit 1 ;;
            esac
          fi
          ACCEL_PIN="${ACCEL_INPUT// /}"
          if [ -n "$ACCEL_PIN" ]; then
            case "$ACCEL_PIN" in
              auto|tcg|hvf|kvm) ;;
              *) echo "::error::Invalid accel '$ACCEL_PIN' — must be one of auto, tcg, hvf, kvm (quickchr's AccelMode)"; exit 1 ;;
            esac
          fi
          # Same rule as the levers above: validate here so a typo costs no runner
          # minutes. A non-numeric value would be silently ignored by the script's
          # Number() and the run would be labelled "watchdog forced" while running
          # the ordinary caps — the flavour of lie this section exists to prevent.
          WATCHDOG_CAP="${WATCHDOG_CAP_INPUT// /}"
          if [ -n "$WATCHDOG_CAP" ]; then
            if ! printf '%s' "$WATCHDOG_CAP" | grep -qE '^[1-9][0-9]*$'; then
              echo "::error::Invalid watchdog-cap '$WATCHDOG_CAP' — expected a positive whole number of seconds (it can only SHORTEN a cap; values at or above the checked-in cap are ignored by scripts/ci-file-watchdog.ts)"
              exit 1
            fi
            echo "::warning::watchdog-cap=${WATCHDOG_CAP}s is set — every test file is capped at or below ${WATCHDOG_CAP}s. This is an experiment lever for exercising the timeout path (#77); a normal run must not set it."
          fi
          FILTER="${TEST_FILTER// /}"
          inc='[]'
          IFS=',' read -ra IDS <<< "$LIST"
          for id in "${IDS[@]}"; do
            [ -z "$id" ] && continue
            if ! row=$(table "$id"); then
              echo "::error::Unknown platform id '$id' (valid: linux-x86, linux-arm64, macos-arm64, macos-x86, windows-x86, gating, all)"
              exit 1
            fi
            IFS='|' read -r label runner accel budget <<< "$row"
            # smoke is OPT-IN (tcg-smoke input), never an implicit narrowing: an
            # explicit platforms=all/windows-x86 dispatch means the full suite.
            # Eligibility follows `budget`, not the accelerator: the point of the
            # smoke subset is to cap legs that take hours, whatever makes them slow.
            smoke=false
            [ "$budget" = "extended" ] && [ "$TCG_SMOKE" = "true" ] && smoke=true
            # Full suite on a slow leg is slow but real (the "find out" path) —
            # give it a generous cap. Smoke/filtered slow legs and fast legs stay
            # tight so a hang is caught quickly.
            timeout=60
            if [ "$budget" = "extended" ]; then
              if [ "$smoke" = "true" ] || [ -n "$FILTER" ]; then timeout=90; else timeout=300; fi
            fi
            # Step budget for the test step, 10 min under the job budget (#76).
            # `if: always()` is worthless when the JOB timeout fires — GitHub tears
            # the job down and the upload steps never run, which is exactly why
            # macos-x86 has produced zero artifacts for weeks. A step-level cap
            # inside the job budget kills only the step, so the reap, metrics,
            # summary and artifact-upload steps still run and the leg fails with
            # its evidence attached. (It does not rescue a runner that loses
            # communication with the server — nothing in-job can.)
            steptimeout=$((timeout - 10))
            # A source QEMU build runs BEFORE the test step, so it eats the job
            # budget without touching the step budget. Pad the outer number only
            # — growing the step cap too would quietly buy a hang more rope,
            # which is exactly the anti-pattern in this program's rule 5.
            [ -n "$QV" ] && timeout=$((timeout + 20))
            # Resolved versions already claimed on THIS platform. Two targets can
            # resolve to one version (`stable,7.23.2` when stable *is* 7.23.2),
            # which would otherwise give two legs the same cache key and race
            # them to save it — one upload of a few hundred MB always discarded.
            # The first leg to claim a version owns it; the rest read.
            claimed=""
            for t in "${TARGET_ARR[@]}"; do
              [ -z "$t" ] && continue
              # The concrete version behind this target, from the resolve step.
              # Carried on the matrix entry so the integration and examples legs
              # derive the SAME cache key from the SAME resolution (#104) — the
              # two jobs consume this one matrix, so they cannot disagree.
              resolved=$(printf '%s' "$RESOLVED_MAP" | jq -r --arg t "$t" '.[$t] // empty')
              if [ -z "$resolved" ]; then
                echo "::error::Target '$t' has no resolved version — the resolve step and this matrix disagree"
                exit 1
              fi
              cacheowner=true
              case " $claimed " in
                *" $resolved "*)
                  cacheowner=false
                  echo "::notice::${id} · ${t} resolves to ${resolved}, already claimed on this platform — this leg reads the cache, it does not write it" ;;
                *) claimed="$claimed $resolved" ;;
              esac
              inc=$(printf '%s' "$inc" | jq -c \
                --arg id "$id" --arg label "$label" --arg os "$runner" \
                --arg target "$t" --arg resolved "$resolved" --arg accel "$accel" --arg budget "$budget" \
                --argjson smoke "$smoke" --argjson timeout "$timeout" \
                --argjson steptimeout "$steptimeout" --argjson cacheowner "$cacheowner" \
                '. + [{id:$id, label:$label, os:$os, accel:$accel, budget:$budget, smoke:$smoke, timeout:$timeout, steptimeout:$steptimeout, target:$target, resolved:$resolved, cacheowner:$cacheowner}]')
            done
          done
          if [ "$inc" = "[]" ]; then
            echo "::error::platforms × targets resolved to an empty matrix — nothing would run"
            exit 1
          fi
          echo "matrix={\"include\":$inc}" >> "$GITHUB_OUTPUT"
          echo "Resolved matrix: $inc"

  # ── integration suite (platform matrix) ──────────────────────────────────────
  integration:
    name: Integration (${{ matrix.label }} · ${{ matrix.target }})
    needs: plan
    if: ${{ inputs.run-integration }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    # `checks: write` is what lets a leg leave a progress marker the runner does
    # not own (B5 of #110). A job-level block REPLACES the workflow-level one, so
    # `contents: read` is restated rather than inherited.
    permissions:
      contents: read
      checks: write
    defaults:
      run:
        shell: bash
    env:
      QUICKCHR_TEST_TARGET: ${{ matrix.target }}
      # Tee the guest serial console to <machineDir>/serial.log. Safe here and
      # only here: provisioning types the generated password over serial in
      # cleartext, but CI passwords are per-run throwaways.
      QUICKCHR_SERIAL_LOG: "1"
      # Let a boot failure run the counting-rule probe (#105) — the only
      # instrument that says whether the guest received the SYNs at all, and so
      # whether a #79-style silent drop is RouterOS-side or in the RX path. It
      # writes a mangle passthrough rule into a guest that is about to be
      # destroyed; that is only acceptable because these machines are per-run
      # throwaways, which is why it is opt-in rather than always on.
      QUICKCHR_DEEP_BOOT_DIAGNOSTICS: "1"
      # QUICKCHR_PRESERVE_ON_FAILURE is deliberately NOT set. The boot-failure
      # report is written to <dataDir>/failures/ and embeds qemu.log + serial.log
      # in full, so it already survives cleanup — preserving the machine dir adds
      # no evidence here, and nobody inspects a runner after the job ends. What it
      # would add is risk on a full matrix: each stranded machine holds ~130-190 MB
      # and its port block, and test/preload.ts runs a storage preflight that
      # exits(1) on INSUFFICIENT_DISK_SPACE — so a couple of real failures could
      # cascade into unrelated red files and obscure the very failure we are
      # chasing. The flag stays for local debugging (see testing.instructions.md).
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # setup-bun action v2.2.0

      # ipxe-qemu provides efi-virtio.rom (needed by virtio-net-pci); harmless on
      # x86, mandatory on arm64. qemu-efi-aarch64 = UEFI firmware for virt machine.
      - name: Install QEMU + tools (Linux x86)
        if: ${{ matrix.id == 'linux-x86' }}
        run: |
          set -eo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            qemu-system-x86 qemu-utils ipxe-qemu sshpass

      - name: Install QEMU + tools (Linux arm64)
        if: ${{ matrix.id == 'linux-arm64' }}
        run: |
          set -eo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            qemu-system-arm qemu-utils qemu-efi-aarch64 ipxe-qemu sshpass

      - name: Install QEMU + tools (macOS)
        if: ${{ runner.os == 'macOS' }}
        run: brew install qemu sshpass

      # EXPERIMENT LEVER — see the header. Inert unless qemu-version is set.
      - name: Build upstream QEMU from source (experiment lever)
        if: ${{ runner.os == 'Linux' && inputs.qemu-version != '' }}
        env:
          QEMU_VERSION: ${{ inputs.qemu-version }}
          QEMU_TARGET: ${{ matrix.id == 'linux-arm64' && 'aarch64-softmmu' || 'x86_64-softmmu' }}
        run: |
          set -eo pipefail
          # Re-validated here and not only in plan: this string is interpolated
          # into a download URL, and the step must be safe read on its own.
          if ! printf '%s' "$QEMU_VERSION" | grep -qE '^[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "::error::Refusing to build QEMU from unvalidated version '$QEMU_VERSION'"
            exit 1
          fi
          PREFIX="$HOME/qemu-$QEMU_VERSION"
          # No actions/cache here on purpose, and that survives #104's key
          # redesign: this is an experiment lever that runs a handful of times per
          # hypothesis, so a multi-hundred-MB build tree per QEMU version would
          # spend quota the CHR image entries need more. Rebuild each time.
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            build-essential ninja-build pkg-config python3-venv \
            libglib2.0-dev libpixman-1-dev libslirp-dev libfdt-dev zlib1g-dev flex bison
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o qemu.tar.xz "https://download.qemu.org/qemu-${QEMU_VERSION}.tar.xz"
          tar xf qemu.tar.xz
          cd "qemu-${QEMU_VERSION}"
          # meson is deliberately NOT apt-installed: QEMU ships a pinned meson
          # wheel and bootstraps it into a venv when the system one is too old,
          # so letting configure decide keeps the build reproducible across
          # distro meson versions.
          #
          # --enable-slirp is not optional. quickchr's entire host↔guest path is
          # SLiRP user networking + hostfwd, and QEMU has needed external
          # libslirp since 7.2; a build without it would fail in a way that has
          # nothing to do with the hypothesis under test.
          #
          # --disable-tools drops qemu-img and friends, so the DISTRO qemu-img
          # keeps running. That is the point: only the system emulator changes,
          # and image tooling cannot be blamed for a flip in the result. The
          # aarch64 UEFI firmware (qemu-efi-aarch64) is likewise still the distro
          # one — findEfiFirmware() reads /usr/share, not this prefix.
          ./configure --prefix="$PREFIX" --target-list="$QEMU_TARGET" \
            --enable-slirp --disable-docs --disable-gtk --disable-sdl \
            --disable-vnc --disable-spice --disable-guest-agent --disable-tools
          make -j"$(nproc)"
          make install
          echo "$PREFIX/bin" >> "$GITHUB_PATH"
          # Prove the build can do the one thing the tests need before spending
          # 20 minutes discovering it cannot. A silently slirp-less QEMU would
          # produce a "no REST" failure that looks exactly like #79.
          bin="$PREFIX/bin/qemu-system-${QEMU_TARGET%-softmmu}"
          "$bin" --version
          # `-M none` is required: bare `-netdev help` exits with "No machine
          # specified, and there is no default" and lists nothing, which made the
          # first version of this guard fail a perfectly good build (run
          # 30591946038). Capture the output and PRINT it — a guard that swallows
          # the evidence for its own verdict is not diagnosable.
          netdevs=$("$bin" -M none -netdev help 2>&1 || true)
          printf '%s\n' "$netdevs" | sed 's/^/  /'
          if ! printf '%s\n' "$netdevs" | grep -qw user; then
            echo "::error::Built QEMU $QEMU_VERSION has no 'user' netdev — libslirp missing, the contrast would be meaningless"
            exit 1
          fi
          echo "QUICKCHR_CI_QEMU_SOURCE=upstream-$QEMU_VERSION (built from source; qemu-img and UEFI firmware remain distro)" >> "$GITHUB_ENV"

      # EXPERIMENT LEVER — pin the accelerator so a contrast cannot silently
      # differ in it. Set via GITHUB_ENV rather than job-level env because an
      # empty QUICKCHR_ACCEL is *defined* to the process and parseAccelMode()
      # throws INVALID_SETTING_VALUE on "" — the default must be unset, not blank.
      - name: Pin accelerator (experiment lever)
        if: ${{ inputs.accel != '' }}
        env:
          ACCEL_INPUT: ${{ inputs.accel }}
        run: |
          set -eo pipefail
          case "$ACCEL_INPUT" in
            auto|tcg|hvf|kvm) ;;
            *) echo "::error::Invalid accel '$ACCEL_INPUT' — must be one of auto, tcg, hvf, kvm"; exit 1 ;;
          esac
          echo "QUICKCHR_ACCEL=$ACCEL_INPUT" >> "$GITHUB_ENV"
          echo "::notice::Accelerator pinned to '$ACCEL_INPUT' by the accel input — detectAccel is overridden on this leg"

      # No HVF/WHPX on GitHub Windows runners → QEMU falls back to TCG.
      - name: Install QEMU (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          choco install qemu -y --no-progress
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\qemu"

      - name: Enable KVM
        if: ${{ runner.os == 'Linux' }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          if [ -w /dev/kvm ] 2>/dev/null; then
            echo "KVM is available — hardware acceleration active"
          else
            echo "::notice::KVM not available — integration tests will use TCG (slower)"
          fi

      - name: Log platform
        id: platform
        env:
          EXPECTED_ACCEL: ${{ matrix.accel }}
        run: |
          guest_arch=x86
          case "${{ matrix.id }}" in
            linux-arm64|macos-arm64) guest_arch=arm64 ;;
          esac
          # Resolve the detected accelerator first, outside the reporting block,
          # so the summary can state it instead of restating a matrix constant.
          detected=$(QUICKCHR_LOG_ARCH="$guest_arch" bun --eval 'const { detectAccel } = await import("./src/lib/platform.ts"); process.stdout.write(await detectAccel(process.env.QUICKCHR_LOG_ARCH));' 2>/dev/null || echo unknown)
          # Published so the leg checkpoint records the DETECTED accelerator, not
          # the matrix's expectation — the two disagreed on macos-x86 for weeks
          # (#76), and a ledger entry restating the table would hide a repeat.
          echo "accel=$detected" >> "$GITHUB_OUTPUT"
          {
            echo "### Platform: ${{ matrix.label }} — target ${{ matrix.target }}"
            echo "- Matrix: id=${{ matrix.id }} runner=${{ matrix.os }} runner.os=${{ runner.os }} runner.arch=${{ runner.arch }}"
            echo "- OS: $(uname -s 2>/dev/null || echo Windows) $(uname -m 2>/dev/null || echo x86_64)"
            echo "- Bun: $(bun --version)"
            bun --eval 'const os = await import("node:os"); const c = os.cpus(); console.log(`- Process: platform=${process.platform} arch=${process.arch} cpuCount=${c.length} cpuModel=${c[0]?.model ?? "unknown"} totalMemMiB=${Math.round(os.totalmem() / 1048576)} freeMemMiB=${Math.round(os.freemem() / 1048576)}`);'
            qemu-system-x86_64 --version 2>/dev/null | head -1 | sed 's/^/- QEMU: /' || true
            qemu-system-aarch64 --version 2>/dev/null | head -1 | sed 's/^/- QEMU: /' || true
            # Which QEMU actually got used is the whole point of a version
            # contrast, so the artifact states it outright instead of leaving it
            # to be inferred from a version string.
            echo "- QEMU provenance: ${QUICKCHR_CI_QEMU_SOURCE:-distro package (qemu-version input not set)}"
            qemu_path=$(command -v "qemu-system-$([ "$guest_arch" = arm64 ] && echo aarch64 || echo x86_64)" 2>/dev/null || echo "not found")
            echo "- QEMU resolved on PATH: $qemu_path"
            command -v qemu-img >/dev/null 2>&1 && qemu-img --version 2>/dev/null | head -1 | sed 's/^/- qemu-img: /' || true
            echo "- RouterOS target: \`${QUICKCHR_TEST_TARGET:-stable (default)}\`"
            QUICKCHR_LOG_ARCH="$guest_arch" bun --eval 'const { detectAccel, isCrossArchEmulation, accelTimeoutFactor } = await import("./src/lib/platform.ts"); const arch = process.env.QUICKCHR_LOG_ARCH; const accel = await detectAccel(arch); const cross = isCrossArchEmulation(arch); console.log(`- quickchr detectAccel(${arch}): ${accel} (crossArch=${cross}, timeoutFactor=${accelTimeoutFactor(accel, cross)})`);'
            # ONE accel statement per leg, and it reports what was detected.
            # Until #76 this line printed the matrix's hardcoded flag directly
            # under the detectAccel line that contradicted it (macos-x86 was
            # labelled TCG while detectAccel returned hvf), and that flag —
            # not the detected value — drove the timeout and smoke planning.
            echo "- Accel: detected=$detected expected=$EXPECTED_ACCEL (guest $guest_arch) — budget class ${{ matrix.budget }}"
            if [ "$detected" != "$EXPECTED_ACCEL" ]; then
              # An explicit pin is not drift and not a runner condition. Check it
              # first, or a `-f accel=tcg` contrast on linux-arm64 would print the
              # "no writable /dev/kvm" notice and record the wrong reason for TCG.
              if [ -n "${QUICKCHR_ACCEL:-}" ]; then
                echo "::notice::${{ matrix.id }} ran '$detected' because the accel input pinned QUICKCHR_ACCEL=$QUICKCHR_ACCEL — the matrix's '$EXPECTED_ACCEL' is deliberately overridden on this leg."
              # A Linux leg dropping kvm→tcg is a known runner condition, not a
              # wrong table: hosted runners sometimes ship without a writable
              # /dev/kvm (#79). Say so, but do not cry drift — a ::warning:: that
              # fires on an expected fallback is the noise that hides the real one.
              elif [ "${{ runner.os }}" = "Linux" ] && [ "$EXPECTED_ACCEL" = "kvm" ] && [ "$detected" = "tcg" ]; then
                echo "::notice::${{ matrix.id }} fell back to TCG — no writable /dev/kvm on this runner. Expected-but-slow; see the KVM probe above."
              else
                echo "::warning::Accel drift on ${{ matrix.id }}: detectAccel($guest_arch) returned '$detected' but the plan matrix expects '$EXPECTED_ACCEL' — update the platform table in integration.yml"
              fi
            fi
            if [ "${{ runner.os }}" = "Linux" ]; then
              if [ -e /dev/kvm ]; then
                echo "- /dev/kvm: $(ls -l /dev/kvm)"
              else
                echo "- /dev/kvm: absent"
              fi
              if [ -w /dev/kvm ] 2>/dev/null; then echo "- /dev/kvm writable: yes"; else echo "- /dev/kvm writable: no"; fi
              qemu_bin=qemu-system-x86_64
              [ "$guest_arch" = "arm64" ] && qemu_bin=qemu-system-aarch64
              if command -v "$qemu_bin" >/dev/null 2>&1; then
                probe_pid="${RUNNER_TEMP:-/tmp}/quickchr-kvm-probe.pid"
                probe_log="${RUNNER_TEMP:-/tmp}/quickchr-kvm-probe.log"
                rm -f "$probe_pid" "$probe_log"
                if "$qemu_bin" -machine none -accel kvm -display none -nodefaults -daemonize -pidfile "$probe_pid" >"$probe_log" 2>&1; then
                  echo "- KVM open probe: ok ($qemu_bin)"
                  if [ -s "$probe_pid" ]; then kill "$(cat "$probe_pid")" 2>/dev/null || true; fi
                else
                  rc=$?
                  echo "- KVM open probe: failed rc=$rc ($qemu_bin)"
                  sed 's/^/  /' "$probe_log" | head -20 || true
                fi
              fi
            elif [ "${{ runner.os }}" = "macOS" ]; then
              echo "- kern.hv_support: $(sysctl -n kern.hv_support 2>/dev/null || echo unavailable)"
            fi
          } | tee "$HOME/platform-info.txt" | tee -a "$GITHUB_STEP_SUMMARY"

      # ── CHR image cache (#104) ────────────────────────────────────────────────
      # The key names the platform and the CONCRETE version this leg boots — no
      # run id, no channel alias — so an exact hit means the entry already holds
      # what the leg needs and actions/cache is right to skip its save. The old
      # `-v2-…-{run_id}-{run_attempt}` key rotated on purpose (a static key never
      # re-saves, #91), but that made every leg write a fresh 250-520 MB entry:
      # ~1 GB per push to main, past the 10 GB quota, with cold download left as
      # an uncontrolled variable in every timing measurement (#106).
      #
      # ONE OWNER PER KEY. Only a full, unfiltered integration leg writes. It is
      # the only configuration that downloads the whole set (resolved target +
      # the suite's version-pinned images and package archives), so entry content
      # stays a function of the key. A filtered/smoke leg or the examples-smoke
      # job restores read-only: if a partial run owned the key, the next full run
      # would hit it exactly, skip its save, and re-download the missing pinned
      # images forever — #91 again, from the other direction.
      #
      # `path` is getCacheDir()'s answer rather than a literal, so the workflow
      # cannot drift from the directory quickchr actually downloads into.
      #
      # Restore and save are SEPARATE actions on purpose. `actions/cache`'s
      # combined form saves in a post step whose only condition is job success,
      # which is too blunt: `matrix.resolved` is fixed at planning time, but a
      # channel target is re-resolved by every start(), so a release landing
      # mid-dispatch has the leg downloading 7.23.3 under a key naming 7.23.2.
      # An exact hit writes nothing and the drift is harmless; a MISS would save
      # mislabelled content, and that never heals — later legs pinned to 7.23.2
      # exact-hit an entry without their image forever. The explicit save below
      # runs only after verifying the directory holds what the key claims.
      - name: Resolve cache identity
        id: cache
        env:
          TEST_FILTER: ${{ inputs.test-filter }}
          SMOKE: ${{ matrix.smoke }}
          RESOLVED: ${{ matrix.resolved }}
          PLATFORM: ${{ matrix.id }}
          CACHE_OWNER: ${{ matrix.cacheowner }}
        run: |
          set -eo pipefail
          # Three ways to be a reader, and the log says which: this leg runs a
          # subset (filter/smoke), or another leg in this dispatch already claimed
          # the same platform+version (plan decides that, so it cannot be a race).
          owner=true
          why=""
          if [ -n "${TEST_FILTER// /}" ]; then owner=false; why="test-filter is set"; fi
          if [ "$SMOKE" = "true" ]; then owner=false; why="tcg-smoke subset"; fi
          if [ "$CACHE_OWNER" != "true" ]; then owner=false; why="another leg owns this platform+version"; fi
          bun scripts/ci-cache-key.ts leg --version "$RESOLVED" --platform "$PLATFORM" --owner "$owner"
          if [ "$owner" = "true" ]; then
            echo "::notice::Cache OWNER for ${PLATFORM} @ ${RESOLVED} — a miss here re-saves the full image set"
          else
            echo "::notice::Cache READER for ${PLATFORM} @ ${RESOLVED} — ${why}; readers never write (#104)"
          fi

      - name: Restore CHR images
        id: restore
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.cache.outputs.path }}
          key: ${{ steps.cache.outputs.key }}
          restore-keys: ${{ steps.cache.outputs.restore_keys }}

      - run: bun install --frozen-lockfile

      # test-filter arrives via env (never inlined ${{ }} in the script) to avoid
      # workflow template injection. An empty resolution FAILS — a filter typo or
      # empty smoke subset must never produce a zero-iteration (falsely green) run.
      - name: Resolve test files
        id: files
        env:
          TEST_FILTER: ${{ inputs.test-filter }}
          SMOKE: ${{ matrix.smoke }}
        run: |
          set -eo pipefail
          FILTER="${TEST_FILTER// /}"
          if [ -z "$FILTER" ] && [ "$SMOKE" = "true" ]; then
            # tcg-smoke was requested: run the curated subset that exercises
            # boot + REST end-to-end in minutes instead of hours.
            FILTER="anchor.test.ts"
            echo "::notice::TCG smoke subset: $FILTER (tcg-smoke input; omit it for the full suite)"
          fi
          if [ -z "$FILTER" ]; then
            ALL=""
            for f in test/integration/*.test.ts; do ALL="$ALL $f"; done
            echo "list=$ALL" >> "$GITHUB_OUTPUT"
            # scope=full is what lets a run mark a RouterOS version "tested" in
            # ci-data/tested-versions.json — filtered/smoke runs never do.
            echo "scope=full" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "scope=filtered" >> "$GITHUB_OUTPUT"
          FILES=""
          IFS=',' read -ra PARTS <<< "$FILTER"
          for f in "${PARTS[@]}"; do
            [ -z "$f" ] && continue
            if [ -f "test/integration/$f" ]; then
              FILES="$FILES test/integration/$f"
            else
              echo "::warning::Skipping unknown test file: $f"
            fi
          done
          if [ -z "${FILES// /}" ]; then
            echo "::error::test-filter '$FILTER' matched no known files in test/integration/"
            exit 1
          fi
          echo "list=$FILES" >> "$GITHUB_OUTPUT"

      # ── the leg's server-side progress marker (B5 of #110) ───────────────────
      # Opens a check run this leg PATCHes after every file. A runner that stops
      # talking leaves it un-closed, and the aggregate turns that into a named
      # `runner-lost` entry with the last file attached — the record #76 has
      # never had. Best-effort by contract: the script warns and exits 0 on any
      # API failure, because an instrument that reds the leg it is measuring is
      # exactly the masked signal this program exists to stop.
      - name: Open leg checkpoint
        env:
          FILE_LIST: ${{ steps.files.outputs.list }}
          PLATFORM_ID: ${{ matrix.id }}
          QUICKCHR_RESOLVED_VERSION: ${{ matrix.resolved }}
          QUICKCHR_DETECTED_ACCEL: ${{ steps.platform.outputs.accel }}
          GITHUB_TOKEN: ${{ github.token }}
        # `--state` explicitly, like the watchdog's `--report-dir "$HOME"`: the
        # shell is the single authority on where leg files live, so the state
        # file, the sidecar and the artifact path cannot disagree about `$HOME`
        # on Windows (workspace on D:, quickchr state on C:).
        run: bun scripts/ci-leg-checkpoint.ts open --state "$HOME/leg-checkpoint.json" --files "$FILE_LIST" || true

      # Sequential per-file to avoid 4-way parallel CHR boot contention on 4-CPU
      # runners (boot timeouts under concurrent load — see testing.instructions.md
      # "Integration Test Parallelism"). Output + timing live under $HOME on every
      # platform: on Windows the workspace is on D:\ while quickchr state is on
      # C:\, and upload-artifact needs a common ancestor across all paths.
      - name: Run integration tests (sequential per-file)
        id: run
        # 10 min under the job budget. A JOB timeout tears the whole job down and
        # `if: always()` never runs — that is why macos-x86 produced no artifact
        # at all across weeks of failures (#76). A STEP timeout kills only this
        # step, so the reap / metrics / summary / upload steps below still run and
        # the failure arrives with its evidence.
        timeout-minutes: ${{ matrix.steptimeout }}
        env:
          FILE_LIST: ${{ steps.files.outputs.list }}
          STEP_TIMEOUT_MIN: ${{ matrix.steptimeout }}
          PLATFORM_ID: ${{ matrix.id }}
          QUICKCHR_CI_WATCHDOG_CAP_S: ${{ inputs.watchdog-cap }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          # The deadline this step will actually be killed at, resolved ONCE here
          # rather than per file — a per-file recomputation would let a slow file
          # quietly extend the window it is being measured against (#110 rule 4).
          # scripts/ci-file-watchdog.ts holds a forensics reserve back from it so
          # the reap / metrics / summary / upload steps below always still run.
          deadline=$(( $(date +%s) + STEP_TIMEOUT_MIN * 60 ))
          echo "::notice::step deadline in $STEP_TIMEOUT_MIN min (epoch $deadline)"
          echo "::group::Integration test output"
          : > "$HOME/integration-output.txt"
          : > "$HOME/integration-timing.txt"
          fail=0
          for f in $FILE_LIST; do
            echo "::notice::Running $f"
            # The watchdog owns the cap, the reap and the timing line; stdout and
            # stderr stay inherited so this tee keeps producing byte-identical
            # logs. Its exit code separates "red, keep going" from "stop".
            rc=0
            bun scripts/ci-file-watchdog.ts \
              --file "$f" \
              --timing "$HOME/integration-timing.txt" \
              --report-dir "$HOME" \
              --deadline "$deadline" 2>&1 | tee -a "$HOME/integration-output.txt" || rc=$?
            # Post this file's terminal state before deciding whether to keep
            # going, so the marker exists even when the next line breaks the
            # loop. Reads the watchdog's sidecar rather than re-deriving the
            # outcome here — one producer for that vocabulary. Costs ~1 s of the
            # step budget per file against a 50-290 min cap; `|| true` because a
            # broken instrument must not end a suite that is still running.
            bun scripts/ci-leg-checkpoint.ts mark \
              --state "$HOME/leg-checkpoint.json" \
              --from "$HOME/watchdog-last-file.json" || true
            case "$rc" in
              0) ;;
              1|2) fail=1 ;;
              # 3 = the reap could not confirm the environment is clean, 4 = the
              # step budget is spent. Running the remaining files in either state
              # turns one root cause into a string of misleading failures (#77).
              *) fail=1; echo "::error::Stopping the file loop after $f (watchdog rc=$rc)"; break ;;
            esac
          done
          echo "::endgroup::"
          exit "$fail"

      # Terminal for the check run opened above. `always()`, so a red suite still
      # closes it — an un-closed check run means "the runner vanished", and a
      # normal test failure leaving one behind would make that signal a lie.
      # Concludes `neutral` rather than `failure` when the suite went red: the
      # leg's own job already carries that verdict, and a second red check would
      # double-count one failure everywhere the commit's checks are read.
      - name: Close leg checkpoint
        if: always()
        env:
          PLATFORM_ID: ${{ matrix.id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bun scripts/ci-leg-checkpoint.ts close \
            --state "$HOME/leg-checkpoint.json" \
            --conclusion "${{ steps.run.outcome == 'success' && 'success' || 'neutral' }}" || true

      # TCG QEMU orphans keep burning 100% CPU after a timeout/cancel, starving the
      # runner until it loses communication and later steps never run. Reap them
      # unconditionally; harmless when nothing is left.
      - name: Kill leftover QEMU processes
        if: always()
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            taskkill //IM qemu-system-x86_64.exe //F 2>/dev/null || true
          else
            pkill -TERM -f 'qemu-system-(x86_64|aarch64)' 2>/dev/null || true
            sleep 3
            pkill -KILL -f 'qemu-system-(x86_64|aarch64)' 2>/dev/null || true
          fi
          true

      # ── the owner's save (#104) ───────────────────────────────────────────────
      # Explicit rather than actions/cache's post step, so it can carry three
      # conditions instead of one:
      #
      #   owner            — a full unfiltered leg that claimed this key in plan
      #   restore missed   — an exact hit already holds this content; re-uploading
      #                      several hundred MB to replace it with itself is waste
      #   content verified — the directory really holds an image of the version
      #                      the key names (see the drift guard in ci-cache-key.ts)
      #
      # No `if: always()`: reaching this step at all means the test loop ran to
      # completion. A leg torn down mid-suite holds a partial set and must never
      # own the key — the same reason a filtered leg cannot. That is why a
      # platform whose suite never finishes never populates its entry (#76/B8).
      - name: Verify cache content matches the key
        id: verify
        if: ${{ steps.cache.outputs.owner == 'true' && steps.restore.outputs.cache-hit != 'true' }}
        env:
          RESOLVED: ${{ matrix.resolved }}
        run: |
          set -eo pipefail
          bun scripts/ci-cache-key.ts verify --version "$RESOLVED"

      - name: Save CHR images (owner)
        if: ${{ steps.cache.outputs.owner == 'true' && steps.restore.outputs.cache-hit != 'true' && steps.verify.outputs.matches == 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.cache.outputs.path }}
          key: ${{ steps.cache.outputs.key }}

      - name: Report a skipped save
        if: ${{ steps.cache.outputs.owner == 'true' && steps.restore.outputs.cache-hit != 'true' && steps.verify.outputs.matches != 'true' }}
        env:
          RESOLVED: ${{ matrix.resolved }}
          TARGET: ${{ matrix.target }}
        run: |
          echo "::warning::Not saving ${{ steps.cache.outputs.key }} — the cache holds no image for ${RESOLVED}. Target '${TARGET}' most likely re-resolved to a newer release after plan fixed the key. Nothing is poisoned; the next dispatch keys on the new version and saves. See the drift guard in scripts/ci-cache-key.ts."

      # Diagnostic regression guard, arm64 only (historical stale-REST bug). Its
      # failure is the signal being collected, so it never gates — the explicit
      # PASS/FAIL notice below is the honest reporting path, not a hidden skip.
      - name: Run arm64 REST ordering repro
        if: ${{ always() && matrix.id == 'linux-arm64' }}
        run: |
          set -eo pipefail
          echo "::group::arm64 REST ordering repro (test/lab/arm64-rest-ordering/repro.test.ts)"
          rc=0
          QUICKCHR_INTEGRATION=1 bun test test/lab/arm64-rest-ordering/repro.test.ts \
            2>&1 | tee "$HOME/arm64-rest-repro.txt" || rc=$?
          echo "::endgroup::"
          echo "repro exit code: $rc" | tee -a "$HOME/arm64-rest-repro.txt"
          if [ "$rc" -eq 0 ]; then
            echo "::notice::arm64 REST repro PASSED — GET→POST ordering is correct (no stale-response)"
          else
            echo "::warning::arm64 REST repro FAILED (rc=$rc) — see scenario output for which layer is at fault"
          fi
        timeout-minutes: 15

      # Metrics as a byproduct (#30): boots from the library's boot-history log
      # + the per-file timing file → one metrics.ndjson (uploaded always; the
      # aggregate job pushes it to the ci-data branch when collect-metrics is on).
      - name: Assemble metrics
        if: always()
        env:
          PLATFORM_ID: ${{ matrix.id }}
          SCOPE: ${{ steps.files.outputs.scope }}
          SUITE_CONCLUSION: ${{ steps.run.outcome == 'success' && 'pass' || 'fail' }}
        run: bun scripts/ci-metrics.ts assemble --timing "$HOME/integration-timing.txt" --out "$HOME/metrics.ndjson"

      # Agent-friendly summary: failing lines only (not a log dump), then the
      # per-file timing table. The full output is in the artifact.
      - name: Write integration summary
        if: always()
        run: |
          {
            echo "## Integration — ${{ matrix.label }} · ${{ matrix.target }}"
            # Three independent ways this step can fail WITHOUT leaving a `(fail)`
            # line, all of which used to reach the success branch:
            #   1. a watchdog kill — bun is killed mid-file, the log just stops;
            #   2. a startup/import error — bun exits non-zero having printed no
            #      test result at all;
            #   3. the watchdog script itself failing, leaving no timing row.
            # (1) and (2) are visible in the timing file, (3) only in the step
            # outcome, so the success line is gated on both.
            watchdog_fired=false
            grep -qE 'file-watchdog-timeout|not-run' "$HOME/integration-timing.txt" 2>/dev/null && watchdog_fired=true
            timing_all_pass=true
            if [ -s "$HOME/integration-timing.txt" ] && awk 'NF && $3 != "pass" { found = 1 } END { exit !found }' "$HOME/integration-timing.txt"; then
              timing_all_pass=false
            fi
            run_outcome="${{ steps.run.outcome }}"
            if [ ! -s "$HOME/integration-output.txt" ]; then
              echo "❌ no test output captured — the run step likely failed before bun test"
            elif grep -qE '\(fail\)' "$HOME/integration-output.txt"; then
              echo "### ❌ Failing tests"
              echo '```'
              grep -E '\(fail\)' "$HOME/integration-output.txt" | head -40
              echo '```'
              echo ""
              echo "### Last errors"
              echo '```'
              grep -B1 -A4 -E '^error:|error\(' "$HOME/integration-output.txt" | tail -60 || true
              echo '```'
            elif [ "$watchdog_fired" = "true" ]; then
              echo "❌ a file was killed by the watchdog or never started — see below"
            elif [ "$run_outcome" != "success" ] || [ "$timing_all_pass" != "true" ]; then
              echo "❌ the integration step failed without a per-test \`(fail)\` line (startup/import error, or the watchdog itself) — see the output and timing below"
            else
              echo "✅ all selected integration tests passed"
            fi
            echo ""
            echo "### Per-file timing"
            echo '```'
            cat "$HOME/integration-timing.txt" 2>/dev/null || echo "(no timing captured)"
            echo '```'
            # A watchdog kill is the one outcome whose evidence is NOT in the test
            # output — bun was killed mid-file, so the log just stops. The report
            # carries the cap, the reap result and the host state instead.
            if [ "$watchdog_fired" = "true" ]; then
              echo ""
              echo "### ⏱ File watchdog fired"
              for r in "$HOME"/watchdog-*.json; do
                [ -e "$r" ] || continue
                echo '```json'
                cat "$r"
                echo '```'
              done
            fi
            if [ -s "$HOME/arm64-rest-repro.txt" ]; then
              echo ""
              echo "### arm64 REST ordering repro (diagnostic, non-gating)"
              echo '```'
              tail -5 "$HOME/arm64-rest-repro.txt"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # include-hidden-files is MANDATORY here, not a nicety. The POSIX data root
      # is ~/.local/share/quickchr — `.local` is a dot directory, and
      # upload-artifact excludes hidden paths by default. Every Linux and macOS
      # integration artifact had been silently dropping boot-log.ndjson,
      # machine.json and qemu.log for exactly that reason; `if-no-files-found:
      # warn` never fired because the four non-hidden ~/ files still matched, so
      # the artifact looked healthy. Verified in run 30308608464, where the
      # linux-x86 upload logged `include-hidden-files: false` / "there will be 4
      # files uploaded". The Windows step is unaffected — AppData is not hidden by
      # this rule — which is why only that leg ever shipped a boot-log.
      - name: Upload integration logs (POSIX)
        if: ${{ always() && runner.os != 'Windows' }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.artifact-prefix || 'integration' }}-logs-${{ matrix.id }}-${{ matrix.target }}
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            ~/platform-info.txt
            ~/integration-output.txt
            ~/integration-timing.txt
            ~/watchdog-*.json

            ~/leg-checkpoint.json
            ~/metrics.ndjson
            ~/issue69-*.ndjson
            ~/arm64-rest-repro.txt
            ~/.local/share/quickchr/boot-log.ndjson
            ~/.local/share/quickchr/failures/*.json
            ~/.local/share/quickchr/machines/**/*.json
            ~/.local/share/quickchr/machines/**/*.log
          retention-days: 7

      - name: Upload integration logs (Windows)
        if: ${{ always() && runner.os == 'Windows' }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.artifact-prefix || 'integration' }}-logs-${{ matrix.id }}-${{ matrix.target }}
          if-no-files-found: warn
          path: |
            ~/platform-info.txt
            ~/integration-output.txt
            ~/integration-timing.txt
            ~/watchdog-*.json

            ~/leg-checkpoint.json
            ~/metrics.ndjson
            ~/issue69-*.ndjson
            ~/AppData/Local/quickchr/boot-log.ndjson
            ~/AppData/Local/quickchr/failures/*.json
            ~/AppData/Local/quickchr/machines/**/*.json
            ~/AppData/Local/quickchr/machines/**/*.log
          retention-days: 7

  # ── aggregate: push metrics to the ci-data branch ────────────────────────────
  # Runs when collect-metrics is on, even when integration legs failed — a red
  # run's timing/conclusion is exactly what tested-versions.json must record so
  # the ros-versions scheduler can re-flag the version. Callers via workflow_call
  # must grant `contents: write` (reusable-workflow perms are capped by the
  # calling job). Per-run filenames avoid push conflicts; the refold-retry loop
  # covers the shared rollups (tested-versions.json, attempted-legs.json), which
  # DO conflict when runs land together — see #126 at that step.
  #
  # BEST-EFFORT BY CONTRACT: metrics are side-band. This job goes green with a
  # loud ::warning:: + summary note when folding/pushing fails, because a red
  # here would red main.yml and the PR freshness gate would then block every PR
  # over a metrics hiccup. That is the one deliberate exception to "red is red" —
  # the warning IS the honest signal, and the raw metrics stay in the artifacts.
  aggregate:
    name: Aggregate metrics → ci-data
    needs: [plan, integration]
    if: ${{ !cancelled() && inputs.collect-metrics && inputs.run-integration }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Read the legs' checkpoint check runs, and close the ones whose runner
      # never got to (B5). Callers via workflow_call must grant this too.
      checks: write
      # The jobs API — the free half of the ledger. A vanished leg still records
      # its test step as `in_progress`, which is how a lost runner is told apart
      # from a leg that failed early in setup.
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          ref: ci-data
          path: ci-data
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # setup-bun action v2.2.0
      - run: bun install --frozen-lockfile

      - name: Download metrics artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: ${{ inputs.artifact-prefix || 'integration' }}-logs-*
          path: artifacts

      - name: Fold into ci-data
        id: fold
        run: |
          if ! bun scripts/ci-metrics.ts aggregate --data ci-data --artifacts artifacts; then
            echo "::warning title=ci-data::metrics fold failed — this run's timing is only in the artifacts (see job log)"
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi

      # ── planned-vs-completed (B5 of #110) ─────────────────────────────────────
      # Runs AFTER the fold, because "completed" is defined as "left a metrics
      # record in ci-data/runs" — the artifact is the evidence, never the check
      # run, so a checkpoint that failed to post cannot invent a `runner-lost`
      # for a leg that actually finished.
      #
      # Deliberately NOT folded into tested-versions.json: the version scheduler
      # reads that file as a presence test (ros-versions.yml:99), so an
      # `incomplete` conclusion there would make an aborted run look tested and
      # silently stop rescheduling that version. Maintainer decision, 2026-08-02.
      - name: Reconcile planned legs against completed records
        if: ${{ steps.fold.outputs.failed != 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PLAN_MATRIX: ${{ needs.plan.outputs.matrix }}
        run: |
          printf '%s' "$PLAN_MATRIX" > plan-matrix.json
          bun scripts/ci-leg-ledger.ts build --data ci-data --matrix plan-matrix.json || \
            echo "::warning title=ci-data::leg ledger failed — planned-vs-completed is unrecorded for this run (see job log)"

      # Refold-retry, NOT rebase-retry (#126). A push race is resolved by
      # recomputing this run's contribution on top of the newest remote tree —
      # never by merging two versions of a shared aggregate textually.
      #
      # Why the old `git pull --rebase … || true` could not work: `runs/*.ndjson`
      # is unique per leg and cannot conflict, but `attempted-legs.json` (B5) and
      # `tested-versions.json` are shared aggregates every concurrent run
      # rewrites. A content conflict left the rebase mid-flight with unmerged
      # files and `|| true` swallowed it, so every later attempt died on
      # "Pulling is not possible because you have unmerged files" — all four
      # burned in 1.1 s. Measured on run 30760428239 (B8a of #110), which
      # completed a leg cleanly and still lost its metrics.
      #
      # Refolding is correct because both writers are read-modify-write keyed by
      # identity: `ci-leg-ledger` keys `attempted-legs.json` by run id, and
      # `ci-metrics` folds `tested-versions.json` by version/platform. Re-running
      # them against a freshly fetched tree yields the union with no merge at
      # all, which is why the reset below is safe to do unconditionally.
      - name: Commit and push (refold-retry, best-effort)
        if: ${{ steps.fold.outputs.failed != 'true' }}
        env:
          # The ledger re-run reads the jobs API and the legs' check runs.
          GITHUB_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -o pipefail
          git -C ci-data config user.name "github-actions[bot]"
          git -C ci-data config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Returns non-zero when there is nothing to record, exactly as the
          # original inline sequence did.
          # 1 = nothing staged (a legitimate no-op), 2 = the commit itself failed.
          # The caller must not read those as the same thing: "nothing to record"
          # is a clean exit, a failed commit is a problem that has to be said out
          # loud rather than exited 0 over.
          stage_and_commit() {
            git -C ci-data add runs tested-versions.json
            # Separate and tolerant: the ledger step is best-effort like the rest
            # of this job, and a `git add` on a file it did not write would abort
            # the push of the metrics that ARE there.
            git -C ci-data add attempted-legs.json 2>/dev/null || true
            if git -C ci-data diff --cached --quiet; then
              return 1
            fi
            git -C ci-data commit -m "metrics: run ${RUN_ID} (${EVENT_NAME})" || return 2
          }

          # Non-zero when EITHER fold failed. Both matter: `ci-metrics` owns this
          # run's runs/*.ndjson and tested-versions.json, `ci-leg-ledger` owns its
          # attempted-legs.json entry. Treating a half-refold as success would let
          # the loop commit and push partial data and then exit 0 — silent metrics
          # loss, which is #126's own failure shape one level up.
          refold() {
            rc=0
            bun scripts/ci-metrics.ts aggregate --data ci-data --artifacts artifacts || {
              echo "::warning title=ci-data::refold: metrics aggregate failed on retry"
              rc=1
            }
            # Written by the reconcile step, which shares this step's `if:`.
            if [ -f plan-matrix.json ]; then
              bun scripts/ci-leg-ledger.ts build --data ci-data --matrix plan-matrix.json || {
                echo "::warning title=ci-data::refold: leg ledger failed on retry"
                rc=1
              }
            fi
            return "$rc"
          }

          stage_and_commit
          case $? in
            1) echo "no metrics changes to record"; exit 0 ;;
            2) echo "::warning title=ci-data::could not commit metrics — this run's timing is only in the artifacts"; exit 0 ;;
          esac
          have_commit=true

          for attempt in 1 2 3 4; do
            # Guarded on purpose. A reset below discards this run's commit, so if
            # the refold that should rebuild it failed, HEAD equals the remote and
            # `git push` would print "Everything up-to-date" and exit 0 — reporting
            # success while this run's metrics are gone. Never push a no-op.
            if [ "$have_commit" = true ] && git -C ci-data push origin ci-data; then
              exit 0
            fi
            if [ "$attempt" = 4 ]; then break; fi
            echo "push attempt $attempt failed — refolding onto the current remote head"
            # Unconditional: leaving unmerged files behind is the whole of #126,
            # so never assume the tree is clean on the way into a retry.
            git -C ci-data rebase --abort 2>/dev/null || true
            git -C ci-data merge --abort 2>/dev/null || true
            # Real backoff. Four attempts in 1.1 s never waited out anything.
            sleep $((attempt * 5))
            # A fetch that fails leaves FETCH_HEAD stale, and resetting onto a
            # stale head would rebuild this run's commit against the wrong base.
            # Keep the commit we already have and just retry the push.
            if ! git -C ci-data fetch origin ci-data; then
              echo "::warning title=ci-data::fetch failed — retrying the push without refolding"
              continue
            fi
            if ! git -C ci-data reset --hard FETCH_HEAD; then
              echo "::warning title=ci-data::reset onto the fetched head failed — retrying"
              have_commit=false
              continue
            fi
            # From here the commit is gone by construction; only a clean refold
            # earns it back.
            have_commit=false
            if ! refold; then
              echo "::warning title=ci-data::refold incomplete — retrying rather than committing partial data"
              continue
            fi
            stage_and_commit
            case $? in
              0) have_commit=true ;;
              1) echo "nothing left to record after refold — another run already carried it"; exit 0 ;;
              2) echo "::warning title=ci-data::could not commit after refold — retrying" ;;
            esac
          done

          echo "::warning title=ci-data::could not push metrics after 4 attempts — this run's timing is only in the artifacts"
          exit 0

      - name: Write aggregate summary
        if: always()
        run: |
          {
            echo "## ci-data"
            echo '```'
            cat ci-data/tested-versions.json 2>/dev/null || echo "(no tested-versions.json)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ── examples smoke (platform matrix) ─────────────────────────────────────────
  # Runs the runnable examples end-to-end (one representative per language for the
  # current OS + the intentional failure-path case) to catch CLI/env/exit-code/
  # cleanup drift the cheap gate (tsc/biome/shellcheck/validate-examples) can't.
  # trial-license is excluded (MikroTik rate limits). No continue-on-error: a
  # broken example is red on every platform it was asked to run on.
  examples-smoke:
    name: Examples smoke (${{ matrix.label }} · ${{ matrix.target }})
    needs: plan
    if: ${{ inputs.run-examples }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    # +20 min when a source QEMU build precedes the examples, for the same reason
    # the integration matrix pads its job budget — the build is not part of what
    # the 60 min is meant to bound.
    timeout-minutes: ${{ inputs.qemu-version != '' && 80 || 60 }}
    defaults:
      run:
        shell: bash
    env:
      QUICKCHR_TEST_TARGET: ${{ matrix.target }}
      EXAMPLE_FILTER: ${{ inputs.example-filter }}
      # See the integration job's env for why serial logging is on and
      # QUICKCHR_PRESERVE_ON_FAILURE is not.
      QUICKCHR_SERIAL_LOG: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # setup-bun action v2.2.0

      - name: Install QEMU + tools (Linux x86)
        if: ${{ matrix.id == 'linux-x86' }}
        run: |
          set -eo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            qemu-system-x86 qemu-utils ipxe-qemu sshpass

      - name: Install QEMU + tools (Linux arm64)
        if: ${{ matrix.id == 'linux-arm64' }}
        run: |
          set -eo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            qemu-system-arm qemu-utils qemu-efi-aarch64 ipxe-qemu sshpass

      - name: Install QEMU + tools (macOS)
        if: ${{ runner.os == 'macOS' }}
        run: brew install qemu sshpass

      # Same two experiment levers as the integration job — mirrored, not shared,
      # because this file already keeps the per-OS install steps duplicated per
      # job. A lever that applied to only one of the two jobs would make a
      # `run-examples=true` dispatch test two different QEMUs in one run.
      - name: Build upstream QEMU from source (experiment lever)
        if: ${{ runner.os == 'Linux' && inputs.qemu-version != '' }}
        env:
          QEMU_VERSION: ${{ inputs.qemu-version }}
          QEMU_TARGET: ${{ matrix.id == 'linux-arm64' && 'aarch64-softmmu' || 'x86_64-softmmu' }}
        run: |
          set -eo pipefail
          if ! printf '%s' "$QEMU_VERSION" | grep -qE '^[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo "::error::Refusing to build QEMU from unvalidated version '$QEMU_VERSION'"
            exit 1
          fi
          PREFIX="$HOME/qemu-$QEMU_VERSION"
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            build-essential ninja-build pkg-config python3-venv \
            libglib2.0-dev libpixman-1-dev libslirp-dev libfdt-dev zlib1g-dev flex bison
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o qemu.tar.xz "https://download.qemu.org/qemu-${QEMU_VERSION}.tar.xz"
          tar xf qemu.tar.xz
          cd "qemu-${QEMU_VERSION}"
          # See the integration job's copy for why slirp is mandatory and why
          # tools/firmware deliberately stay on the distro build.
          ./configure --prefix="$PREFIX" --target-list="$QEMU_TARGET" \
            --enable-slirp --disable-docs --disable-gtk --disable-sdl \
            --disable-vnc --disable-spice --disable-guest-agent --disable-tools
          make -j"$(nproc)"
          make install
          echo "$PREFIX/bin" >> "$GITHUB_PATH"
          bin="$PREFIX/bin/qemu-system-${QEMU_TARGET%-softmmu}"
          "$bin" --version
          # `-M none` is required — see the integration job's copy.
          netdevs=$("$bin" -M none -netdev help 2>&1 || true)
          printf '%s\n' "$netdevs" | sed 's/^/  /'
          if ! printf '%s\n' "$netdevs" | grep -qw user; then
            echo "::error::Built QEMU $QEMU_VERSION has no 'user' netdev — libslirp missing"
            exit 1
          fi
          # Provenance, same as the integration job. This leg replaces the system
          # emulator too, so a run must not have to infer from a version string
          # alone which QEMU it actually exercised.
          echo "QUICKCHR_CI_QEMU_SOURCE=upstream-$QEMU_VERSION (built from source; qemu-img and UEFI firmware remain distro)" >> "$GITHUB_ENV"

      - name: Pin accelerator (experiment lever)
        if: ${{ inputs.accel != '' }}
        env:
          ACCEL_INPUT: ${{ inputs.accel }}
        run: |
          set -eo pipefail
          case "$ACCEL_INPUT" in
            auto|tcg|hvf|kvm) ;;
            *) echo "::error::Invalid accel '$ACCEL_INPUT' — must be one of auto, tcg, hvf, kvm"; exit 1 ;;
          esac
          echo "QUICKCHR_ACCEL=$ACCEL_INPUT" >> "$GITHUB_ENV"
          echo "::notice::Accelerator pinned to '$ACCEL_INPUT' by the accel input — detectAccel is overridden on this leg"

      - name: Install QEMU (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          choco install qemu -y --no-progress
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\qemu"

      # uv runs the Python example representative (mndp.py) the documented way.
      - name: Install uv (Linux/macOS)
        if: ${{ runner.os != 'Windows' }}
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        if: ${{ runner.os == 'Linux' }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      # READ-ONLY (#104). This job used to write a `-ex-` twin of the integration
      # job's entry for the same platform × version — the cache listing showed the
      # pairs at identical sizes, because restore-keys handed it the integration
      # job's content and it saved the same bytes back under a second key. It now
      # restores and never saves; the full integration leg is the single owner
      # (see the integration job's cache block). Examples run their own CHR boots,
      # but every image they need is in the set that leg already downloads.
      - name: Resolve cache identity
        id: cache
        env:
          RESOLVED: ${{ matrix.resolved }}
          PLATFORM: ${{ matrix.id }}
        run: |
          set -eo pipefail
          bun scripts/ci-cache-key.ts leg --version "$RESOLVED" --platform "$PLATFORM" --owner false

      - name: Restore CHR images (reader)
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.cache.outputs.path }}
          key: ${{ steps.cache.outputs.key }}
          restore-keys: ${{ steps.cache.outputs.restore_keys }}

      - run: bun install --frozen-lockfile

      - name: Log platform
        run: |
          {
            echo "### Examples smoke: ${{ matrix.label }} — target ${{ matrix.target }}"
            echo "- OS: $(uname -s 2>/dev/null || echo Windows) / ${{ runner.arch }}"
            echo "- Bun: $(bun --version)"
            echo "- RouterOS target: \`${QUICKCHR_TEST_TARGET:-stable (default)}\`"
            echo "- Example filter: \`${EXAMPLE_FILTER:-curated subset}\`"
            # This job can have its system emulator replaced by the qemu-version
            # lever too, so it has to state which QEMU it ran. Without this the
            # env marker set by the build step is invisible on this leg and a
            # contrast could not be verified from the logs.
            echo "- QEMU provenance: ${QUICKCHR_CI_QEMU_SOURCE:-distro package (qemu-version input not set)}"
            echo "- Accel: ${QUICKCHR_ACCEL:-auto-detected (accel input not set)}"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The harness (test/integration/examples-smoke.test.ts) picks the right
      # representatives for the current OS (.ts everywhere; .sh/.py on POSIX; .ps1
      # on Windows). `bun run` evaluates the VAR=val script prefix cross-platform.
      - name: Run examples smoke harness
        run: |
          set -eo pipefail
          bun run smoke:examples 2>&1 | tee "$HOME/smoke-output.txt"

      - name: Kill leftover QEMU processes
        if: always()
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            taskkill //IM qemu-system-x86_64.exe //F 2>/dev/null || true
          else
            pkill -TERM -f 'qemu-system-(x86_64|aarch64)' 2>/dev/null || true
            sleep 3
            pkill -KILL -f 'qemu-system-(x86_64|aarch64)' 2>/dev/null || true
          fi
          true

      - name: Write smoke summary
        if: always()
        run: |
          {
            echo "## Examples smoke — ${{ matrix.label }} · ${{ matrix.target }}"
            if [ ! -s "$HOME/smoke-output.txt" ]; then
              echo "❌ no output captured — the harness likely failed before running"
            elif grep -qE '\(fail\)' "$HOME/smoke-output.txt"; then
              echo "### ❌ Failing examples"
              echo '```'
              grep -E '\(fail\)' "$HOME/smoke-output.txt" | head -40
              echo '```'
            else
              echo "✅ examples smoke passed"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # This job boots real CHRs and sets QUICKCHR_SERIAL_LOG, but had no upload
      # at all — so smoke-output.txt and any boot-failure report died with the
      # runner. Not hypothetical: #80's savevm timeout surfaced here, via the
      # `rollback` example, and the evidence had to be scraped out of the raw job
      # log. include-hidden-files is required for the POSIX dot-path data root
      # (see the integration job's upload step).
      - name: Upload smoke logs (POSIX)
        if: ${{ always() && runner.os != 'Windows' }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.artifact-prefix || 'integration' }}-smoke-${{ matrix.id }}-${{ matrix.target }}
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            ~/smoke-output.txt
            ~/.local/share/quickchr/boot-log.ndjson
            ~/.local/share/quickchr/failures/*.json
          retention-days: 7

      - name: Upload smoke logs (Windows)
        if: ${{ always() && runner.os == 'Windows' }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.artifact-prefix || 'integration' }}-smoke-${{ matrix.id }}-${{ matrix.target }}
          if-no-files-found: warn
          path: |
            ~/smoke-output.txt
            ~/AppData/Local/quickchr/boot-log.ndjson
            ~/AppData/Local/quickchr/failures/*.json
          retention-days: 7

  # ── PowerShell lint ──────────────────────────────────────────────────────────
  # Static-analyze the example .ps1 mirrors whenever examples run. Reuses the
  # dedicated workflow (which also runs on its own for .ps1 pushes/PRs — #28).
  lint-powershell:
