name: PowerShell Lint

# Lints the example PowerShell mirrors (examples/**/*.ps1) with PSScriptAnalyzer.
#
# Why a dedicated workflow (not a step in ci.yml or only in integration.yml):
#   - PSScriptAnalyzer needs a Windows runner + the module installed; folding it
#     into the Linux core pipeline would slow every push for a niche check.
#   - It used to live ONLY in a dispatch-only workflow, so .ps1 regressions
#     surfaced late — a PSUseUsingScopeModifierInNewRunspaces failure in #22
#     only appeared on a manual verification run (see issue #28).
#
# So: trigger on `.ps1` (and the analyzer settings) changes for fast PR feedback,
# AND expose `workflow_call` so integration.yml reuses the same job when examples
# run — one source of truth for "are the .ps1 examples clean?".

on:
  push:
    branches: [main]
    paths:
      - "examples/**/*.ps1"
      - "examples/PSScriptAnalyzerSettings.psd1"
      - ".github/workflows/lint-powershell.yml"
  pull_request:
    branches: [main]
    paths:
      - "examples/**/*.ps1"
      - "examples/PSScriptAnalyzerSettings.psd1"
      - ".github/workflows/lint-powershell.yml"
  # Reusable: integration.yml calls this so the dispatch path stays covered.
  workflow_call:

permissions:
  contents: read

jobs:
  lint-powershell:
    name: Lint PowerShell examples
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: PSScriptAnalyzer
        shell: pwsh
        env:
          # Pinned so a PSGallery release can't silently change which rules fire and
          # turn this gate red (or green) without a deliberate bump. Latest stable as
          # of 2026-06; raise intentionally and re-verify the .ps1 examples stay clean.
          ANALYZER_VERSION: "1.25.0"
        run: |
          # Parse check FIRST, with PowerShell's own parser — the same one that runs
          # the scripts. PSScriptAnalyzer with a Severity filter does not surface
          # ParserErrors, so a file that cannot be parsed at all can pass this gate:
          # `$LASTEXITCODE:` in examples/common.ps1 (PowerShell reads `$NAME:` as a
          # scope qualifier) killed every helper in that file, left quickstart.ps1
          # running with no functions defined, and the smoke test still reported
          # green because the script exited 0. Found in run 30312099123.
          $parseErrors = @()
          Get-ChildItem -Recurse -Path examples -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            foreach ($e in $errors) {
              $parseErrors += "$($_.FullName):$($e.Extent.StartLineNumber) $($e.Message)"
            }
          }
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Host $_ }
            Write-Error "PowerShell parse errors in $($parseErrors.Count) location(s) — these scripts cannot run at all"
            exit 1
          }
          Write-Host "PowerShell parser: all example .ps1 files parse"

          Install-Module -Name PSScriptAnalyzer -RequiredVersion $env:ANALYZER_VERSION -Force -Scope CurrentUser -ErrorAction Stop
          $settings = Join-Path $PWD 'examples/PSScriptAnalyzerSettings.psd1'
          $issues = Get-ChildItem -Recurse -Path examples -Filter *.ps1 |
            ForEach-Object { Invoke-ScriptAnalyzer -Path $_.FullName -Settings $settings }
          $issues | Format-Table -AutoSize
          if ($issues.Count -gt 0) {
            Write-Error "PSScriptAnalyzer found $($issues.Count) issue(s) in example .ps1 scripts"
            exit 1
          }
          Write-Host "PSScriptAnalyzer: example .ps1 scripts are clean"
